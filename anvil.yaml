    audienceType\": \"Writers and indie game makers who want to build visual novels without code\"}}, {\"@type\": \"WebSite\"\
    , \"@id\": \"https://imgnovella.anvil.app/#site\", \"url\": \"https://imgnovella.anvil.app/\", \"name\": \"ImgNovella\"\
