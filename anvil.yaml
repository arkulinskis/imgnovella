metadata:
  description: 'Make visual novels in your browser: scenes, characters, branching choices and multiple endings. Share a link
    or export a playable HTML game to sell. No scripting.'
  logo_img: asset:icon-512.png
  title: 'ImgNovella: make visual novels online, no coding'
name: ImgNovella
