    og:url\" content=\"https://imgnovella.anvil.app/\">\n<meta property=\"og:image\" content=\"https://imgnovella.anvil.app/_/theme/og-image.png\"\
    >\n<meta property=\"og:image:width\" content=\"1200\"><meta property=\"og:image:height\" content=\"630\">\n<meta property=\"\
    og:image:alt\" content=\"ImgNovella: Make branching visual novels in your browser, then share or sell them\">\n<meta name=\"\
    twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"ImgNovella: make visual novels\
    \ online, no coding\">\n<meta name=\"twitter:description\" content=\"Make visual novels in your browser: scenes, characters,\
    \ branching choices and multiple endings. Share a link or export a playable HTML game to sell. No scripting.\">\n<meta\
    \ name=\"twitter:image\" content=\"https://imgnovella.anvil.app/_/theme/og-image.png\">\n<link rel=\"alternate\" type=\"\
