    <noscript><div class="seo-noscript">
    <h1>ImgNovella: make visual novels online, no coding</h1>
    <p>Make visual novels in your browser: scenes, characters, branching choices and multiple endings. Share a link or export a playable HTML game to sell. No scripting.</p>
    <p>ImgNovella is an online visual novel maker in the spirit of Ren&#x27;Py, with no scripting. Build branching stories with scenes, characters, expressions, backgrounds, choices, variables, conditions and multiple endings.</p>
    <p>Publish them for anyone to play in the browser, or download them as standalone HTML games to sell on itch.io, Gumroad or Ko-fi. Readers get saves, rollback, history, an endings collection, a gallery and ten mini-games.</p>
    <p>Who it's for: Writers and indie game makers who want to build visual novels without code</p>
    <h2>What it does</h2><ul><li>Branching choices, variables, conditions and multiple endings</li><li>Characters with expressions, backgrounds, transitions and CG illustrations</li><li>Music moods, sound effects or your own audio</li><li>Publish to play in the browser, or export a standalone HTML game</li><li>A Discover page with genres, likes and a featured shelf</li></ul>
    <h2>Questions</h2><h3>Do I need to know how to code?</h3><p>No. Everything is built with an editor, no scripting.</p><h3>Can I sell my visual novel?</h3><p>Yes. Export it as a standalone HTML game and sell it on itch.io, Gumroad, Ko-fi or anywhere else.</p><h3>Can readers play without an account?</h3><p>Yes. Published novels play in the browser, and saves live in the reader&#x27;s browser.</p>
    <p><a href="https://imgnovella.anvil.app/about">About ImgNovella</a> &middot; <a href="https://imgnovella.anvil.app/llms.txt">ImgNovella for AI assistants</a> &middot; Made by <a href="https://arkvital.com">Arkvital</a>, Montreal, Canada. ImgNovella needs JavaScript in your browser.</p>
    </div></noscript>
