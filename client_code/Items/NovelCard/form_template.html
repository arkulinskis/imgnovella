<div class="dc-card-box">
  <a class="dc-card" href="#discover" anvil:name="link">
    <anvil-component type="ImgNovella.Components.Cover" name="cover" prop:featured_badge="true"></anvil-component>
    <div>
      <anvil-component type="Label" name="title" prop:role='["dc-title"]'></anvil-component>
      <anvil-component type="Label" name="by" prop:role='["dc-by"]'></anvil-component>
    </div>
    <div class="dc-nums">
      <span><i class="ic ic-play"></i><anvil-component type="Label" name="plays" prop:role='["contents"]'></anvil-component></span>
      <span><i class="ic ic-heart"></i><anvil-component type="Label" name="likes" prop:role='["contents"]'></anvil-component></span>
      <span><i class="ic ic-flag"></i><anvil-component type="Label" name="endings" prop:role='["contents"]'></anvil-component></span>
      <span><i class="ic ic-clock"></i><anvil-component type="Label" name="minutes" prop:role='["contents"]'></anvil-component></span>
    </div>
  </a>
</div>
