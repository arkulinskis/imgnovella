<div class="dc-f-box">
  <a class="ui-card dc-f" href="#discover" anvil:name="link">
    <anvil-component type="ImgNovella.Components.Cover" name="cover"></anvil-component>
    <div>
      <anvil-component type="Label" name="genre" prop:role='["badge"]'></anvil-component>
      <anvil-component type="Label" name="title" prop:role='["dc-f-title"]'></anvil-component>
      <anvil-component type="Label" name="blurb" prop:role='["dc-f-blurb"]'></anvil-component>
      <div class="dc-nums dc-f-nums">
        <anvil-component type="Label" name="by" prop:role='["contents"]'></anvil-component>
        <span><i class="ic ic-play"></i><anvil-component type="Label" name="plays" prop:role='["contents"]'></anvil-component></span>
        <span><i class="ic ic-flag"></i><anvil-component type="Label" name="endings" prop:role='["contents"]'></anvil-component></span>
      </div>
    </div>
  </a>
</div>
